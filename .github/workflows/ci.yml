name: Java CI with Maven

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Ejecutar pruebas (Unit + BDD)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Ejecutar tests (Unit + BDD)
        run: mvn test -Dcucumber.filter.tags=@login

      - name: Generar reporte HTML Surefire
        run: mvn site surefire-report:report

      - name: Generar reporte Cucumber HTML
        run: mvn verify -DskipTests

      - name: Upload reportes de tests
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/cucumber-reports/
          retention-days: 30

      - name: Upload reporte Cucumber HTML
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cucumber-html-report
          path: target/cucumber-reports/cucumber-html-reports/
          retention-days: 30

      - name: Mostrar resumen de resultados
        run: |
          echo "=== Resumen de Tests ==="
          ls -la target/surefire-reports/
          ls -la target/cucumber-reports/
          echo "Archivos de reporte generados exitosamente"