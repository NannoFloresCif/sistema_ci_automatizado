name: Java CI with Maven

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Ejecutar pruebas unitarias
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Ejecutar tests con Maven
        run: mvn clean test

      - name: Generar reporte HTML Surefire
        run: mvn site surefire-report:report

      - name: Upload reporte de tests
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-report
          path: target/surefire-reports/
          retention-days: 30

      - name: Upload reporte HTML
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-html-report
          path: target/site/surefire-report.html
          retention-days: 30

      - name: Mostrar resumen de resultados
        run: |
          echo "=== Resumen de Tests ==="
          ls -la target/surefire-reports/
          echo "Archivos de reporte generados exitosamente"